<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Научные конференции{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'conference_list' %}">Конференции</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{% url 'conference_list' %}">Список</a>
            <a class="nav-link" href="{% url 'participants' %}">Участники</a>
        </div>
        <div class="navbar-nav">
            {% if user.is_authenticated %}
                <span class="navbar-text me-3">
                    {{ user.username }}{% if user.is_staff %} (админ){% endif %}
                </span>
                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
                </form>
            {% else %}
                <a class="nav-link" href="{% url 'login' %}">Войти</a>
                <a class="nav-link" href="{% url 'signup' %}">Регистрация</a>
            {% endif %}
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% block content %}{% endblock %}
</div>
</body>
</html>

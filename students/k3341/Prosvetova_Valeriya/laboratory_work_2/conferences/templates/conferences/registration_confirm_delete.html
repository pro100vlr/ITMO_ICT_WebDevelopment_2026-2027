{% extends 'base.html' %}
{% block title %}Удалить регистрацию{% endblock %}
{% block content %}
<h1>Удалить регистрацию?</h1>
<p>Доклад «{{ registration.talk_title }}» на конференции «{{ registration.conference }}».</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'conference_detail' registration.conference_id %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}

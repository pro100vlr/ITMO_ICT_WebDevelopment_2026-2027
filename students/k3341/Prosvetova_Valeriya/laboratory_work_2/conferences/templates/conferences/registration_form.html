{% extends 'base.html' %}
{% block title %}Изменить регистрацию{% endblock %}
{% block content %}
<h1>Изменить регистрацию</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'conference_detail' registration.conference_id %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
